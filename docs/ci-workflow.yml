# Copy to .github/workflows/ci.yml (the token used by the assistant cannot push workflow files, so add it from the GitHub web UI or your own machine).
name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pandas numpy scipy pyarrow pyyaml pytest
      - run: cd pipelines && python -m spellbreaker_data all   # real downloads, checksum-verified
      - run: python -m pytest -q
