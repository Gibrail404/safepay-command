# Copy to .github/workflows/ci.yml (the assistant's token cannot push workflow files; add it from the GitHub web UI or your own machine).
# NOTE: this file has been written but has not been run on GitHub yet. Expect to fix small things on the first run.
name: ci
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: safepay, POSTGRES_PASSWORD: safepay_dev_only, POSTGRES_DB: safepay_test }
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U safepay -d safepay_test" --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pandas numpy scipy pyarrow pyyaml pytest fastapi pydantic sqlalchemy "psycopg[binary]" uvicorn httpx hypothesis scikit-learn lightgbm rapidfuzz matplotlib
      - run: cd pipelines && python -m safepay_data all       # real downloads, checksum-verified (tests that need models or other data skip themselves)
      - run: python -m pytest tests -q                         # SQLite
      - run: SAFEPAY_TEST_DATABASE_URL=postgresql+psycopg://safepay:safepay_dev_only@127.0.0.1:5433/safepay_test python -m pytest tests -q    # PostgreSQL incl. race tests
  console:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: console } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
