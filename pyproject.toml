[project]
name = "safepay-command"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pandas", "numpy", "scipy", "pyarrow", "pyyaml", "fastapi", "pydantic", "sqlalchemy", "psycopg[binary]", "uvicorn", "httpx", "hypothesis", "scikit-learn", "lightgbm", "torch", "rapidfuzz", "matplotlib"]

[tool.pytest.ini_options]
pythonpath = ["pipelines", "kernel", "ml", "screening", "lab", "graph"]
markers = ["integration: needs the real datasets downloaded (run: python -m safepay_data all)"]
